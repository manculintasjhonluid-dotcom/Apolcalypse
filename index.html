
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apocalypse | Code Aesthetic</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="background-glow"></div>

    <main class="container">
        <header class="header">
            <div>
                <p class="subtitle">A LITTLE PIECE OF FOREVER</p>
                <h1>Apocalypse<span>.</span></h1>
                <p class="artist">Cigarettes After Sex</p>
            </div>
            <div class="status">
                <span class="status-dot"></span>
                NOW PLAYING
            </div>
        </header>

        <section class="editor">
            <div class="editor-header">
                <div class="window-controls">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
                <p>our_story.js</p>
                <span class="editor-label">JAVASCRIPT</span>
            </div>

            <div class="editor-content">
                <div id="lineNumbers" class="line-numbers"></div>
                <div id="code" class="code"></div>
            </div>

            <div class="editor-footer">
                <span>UTF-8</span>
                <span>JavaScript</span>
                <span>♡ made with love</span>
            </div>
        </section>

        <section class="controls">
            <button id="playButton">▶ Play Music</button>
            <button id="replayButton">↻ Replay</button>
        </section>

        <p class="bottom-text">some feelings are written in the stars.</p>

        <audio id="backgroundMusic" preload="auto">
            <source src="audio/apocalypse.mp3" type="audio/mpeg">
        </audio>
    </main>

    <script src="script.js"></script>
</body>
</html>
